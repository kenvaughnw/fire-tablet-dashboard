<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172334"><title>Fire Tablet Photo & Calendar</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0fa;background:#101925}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:9px 12px;background:#375d91;color:white}button:disabled{opacity:.5;cursor:default}.dashboard{display:grid;grid-template-columns:48% 52%;height:100dvh;min-height:400px}.photo{position:relative;background:#090d13;overflow:hidden;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain}.photo .overlay{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{background:#101925dd;border-radius:8px;padding:7px 10px;font-size:12px}.calendar{display:flex;flex-direction:column;min-width:0;padding:12px;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.top h1{font-size:18px;margin:0}.sub{font-size:12px;color:#b6c5d9}.controls{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.controls button{padding:7px 9px}.status{font-size:12px;color:#d2ddeb;min-height:16px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;flex:1;min-height:0}.day{border:1px solid #36475d;background:#1b2b3e;border-radius:8px;min-width:0;overflow-y:auto;padding:6px}.day.today{border-color:#88b6ff}.day-head{text-align:center;font-size:11px;position:sticky;top:-6px;background:#1b2b3e;padding:4px 0 7px}.day-head strong{display:block;font-size:16px}.event{font-size:11px;line-height:1.25;background:#36537a;border-left:3px solid #9dc3ff;border-radius:4px;padding:5px 4px;margin-top:5px;overflow-wrap:anywhere}.event small{display:block;color:#d7e4f5;margin-bottom:2px}.event .name{font-weight:650}.empty{font-size:10px;color:#94a7bd;text-align:center;margin-top:14px}.settings{background:#182638;border:1px solid #33475d;border-radius:8px;padding:9px;display:none;max-height:140px;overflow:auto;font-size:12px}.settings.open{display:block}.settings label{display:block;padding:4px 0}.settings input{vertical-align:middle;margin-right:6px}.footer{font-size:11px;color:#a8b8ca}.hidden{display:none!important}@media(max-width:700px){.calendar{padding:7px;gap:6px}.top h1{font-size:14px}.week{gap:2px}.day{padding:3px}.event{font-size:9px;padding:3px}.day-head{font-size:9px}.day-head strong{font-size:12px}.controls button{padding:5px 6px;font-size:11px}}@media(orientation:portrait){.dashboard{grid-template-columns:1fr;grid-template-rows:35vh 65vh;height:100dvh}.calendar{min-height:0}}
</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body>
<main class="dashboard"><section class="photo" aria-label="Photo slideshow"><img id="photo" alt="Sample slideshow photograph"><div class="overlay"><span class="pill" id="photoLabel">Sample photographs • Google Photos album not yet connected</span><button id="nextPhoto">Next photo</button></div></section>
<section class="calendar"><header class="top"><div><h1 id="weekTitle">Weekly Calendar</h1><div class="sub" id="clock"></div></div><div class="controls"><button id="prev" title="Previous week">‹</button><button id="today">Today</button><button id="next" title="Next week">›</button><button id="connect">Connect Google</button><button id="choose" class="hidden">Calendars</button><button id="disconnect" class="hidden">Sign out</button></div></header><div id="status" class="status" role="status">Connect Google to display your real appointments.</div><div id="settings" class="settings" aria-label="Calendar selection"></div><div id="week" class="week" aria-label="Seven-day calendar"></div><div class="footer">Read-only calendar • Refreshes every 5 minutes while authorized • Photos are samples</div></section></main>
<script>
'use strict';
const CLIENT_ID='1074979195399-dgo2stcal27o1vhvrcf8jn6227a002oh.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/calendar.calendarlist.readonly https://www.googleapis.com/auth/calendar.events.readonly';
const $=id=>document.getElementById(id);
// These are publicly hosted demonstration images, not photographs from your album.
const photos=[
'https://images.unsplash.com/photo-1472396961693-142e6e269027?w=1000&auto=format&fit=crop',
'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1000&auto=format&fit=crop',
'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1000&auto=format&fit=crop'];
let photoIndex=0;function showPhoto(){ $('photo').src=photos[photoIndex];}function nextPhoto(){photoIndex=(photoIndex+1)%photos.length;showPhoto();}showPhoto();$('nextPhoto').onclick=nextPhoto;setInterval(nextPhoto,15000);
let tokenClient=null,accessToken=null,expiresAt=0,calendarList=[],selectedIds=new Set(),weekOffset=0,events=[],loading=false;
function status(s){$('status').textContent=s;}function mondayOf(date){const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()-(d.getDay()+6)%7);return d;}
function range(){const start=mondayOf(new Date());start.setDate(start.getDate()+weekOffset*7);const end=new Date(start);end.setDate(end.getDate()+7);return {start,end};}
function clock(){ $('clock').textContent=new Date().toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}clock();setInterval(clock,30000);
function safeText(parent,tag,text,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=text;parent.appendChild(el);return el;}
function render(){const {start,end}=range();const last=new Date(end);last.setDate(last.getDate()-1);$('weekTitle').textContent=start.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+last.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});const root=$('week');root.replaceChildren();const today=new Date();for(let n=0;n<7;n++){const d=new Date(start);d.setDate(d.getDate()+n);const next=new Date(d);next.setDate(d.getDate()+1);const col=document.createElement('div');col.className='day'+(d.toDateString()===today.toDateString()?' today':'');const header=safeText(col,'div',d.toLocaleDateString(undefined,{weekday:'short'}),'day-head');safeText(header,'strong',String(d.getDate()));const matching=events.filter(ev=>{const s=new Date(ev.start.dateTime||ev.start.date);const e=new Date(ev.end.dateTime||ev.end.date);return s<next&&e>d;}).sort((a,b)=>new Date(a.start.dateTime||a.start.date)-new Date(b.start.dateTime||b.start.date));if(!matching.length)safeText(col,'div','—','empty');for(const ev of matching){const item=document.createElement('div');item.className='event';item.style.borderLeftColor=ev._color||'#9dc3ff';const allDay=!!ev.start.date;const startTime=new Date(ev.start.dateTime||ev.start.date);safeText(item,'small',allDay?'All day':startTime.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}));safeText(item,'div',ev.summary||'(No title)','name');if(ev._calendarName)safeText(item,'small',ev._calendarName);col.appendChild(item);}root.appendChild(col);}}
$('prev').onclick=()=>{weekOffset--;refreshEvents();};$('next').onclick=()=>{weekOffset++;refreshEvents();};$('today').onclick=()=>{weekOffset=0;refreshEvents();};
function showConnected(yes){$('connect').classList.toggle('hidden',yes);$('choose').classList.toggle('hidden',!yes);$('disconnect').classList.toggle('hidden',!yes);}
function getTokenClient(){if(!window.google?.accounts?.oauth2){status('Google sign-in is still loading. Please try again in a moment.');return null;}if(!tokenClient){tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async response=>{if(response.error||!response.access_token){status('Authorization failed: '+(response.error||'No token returned'));return;}accessToken=response.access_token;expiresAt=Date.now()+(Number(response.expires_in||3600)*1000);showConnected(true);status('Connected. Loading calendars…');await loadCalendars();}});}return tokenClient;}
$('connect').onclick=()=>{const client=getTokenClient();if(client)client.requestAccessToken({prompt:'consent'});};
$('disconnect').onclick=()=>{if(accessToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(accessToken,()=>{});accessToken=null;expiresAt=0;events=[];calendarList=[];selectedIds.clear();showConnected(false);$('settings').classList.remove('open');status('Signed out. Connect Google to see appointments.');render();};
async function api(url){if(!accessToken||Date.now()>expiresAt-60000){throw new Error('Google authorization expired. Tap Connect Google to sign in again.');}const res=await fetch(url,{headers:{Authorization:'Bearer '+accessToken}});if(!res.ok){let detail='';try{const data=await res.json();detail=data.error?.message||'';}catch{}if(res.status===401){accessToken=null;showConnected(false);throw new Error('Google session expired. Tap Connect Google to sign in again.');}throw new Error('Google Calendar error '+res.status+(detail?': '+detail:''));}return res.json();}
async function loadCalendars(){try{let pageToken='',list=[];do{const url=new URL('https://www.googleapis.com/calendar/v3/users/me/calendarList');url.searchParams.set('maxResults','250');if(pageToken)url.searchParams.set('pageToken',pageToken);const result=await api(url);list.push(...(result.items||[]));pageToken=result.nextPageToken||'';}while(pageToken);calendarList=list.filter(c=>c.accessRole!=='none');const saved=JSON.parse(localStorage.getItem('fire-dashboard-calendar-ids')||'null');selectedIds=new Set(Array.isArray(saved)?saved.filter(id=>calendarList.some(c=>c.id===id)):calendarList.filter(c=>c.selected!==false).map(c=>c.id));renderSettings();await refreshEvents();}catch(err){status(err.message);}}
function renderSettings(){const root=$('settings');root.replaceChildren();safeText(root,'div','Choose calendars for this dashboard (changes saved on this device):');for(const cal of calendarList){const label=document.createElement('label');const input=document.createElement('input');input.type='checkbox';input.checked=selectedIds.has(cal.id);input.onchange=()=>{if(input.checked)selectedIds.add(cal.id);else selectedIds.delete(cal.id);localStorage.setItem('fire-dashboard-calendar-ids',JSON.stringify([...selectedIds]));refreshEvents();};label.appendChild(input);safeText(label,'span',cal.summary||cal.id);root.appendChild(label);}}
$('choose').onclick=()=>{$('settings').classList.toggle('open');};
async function refreshEvents(){render();if(!accessToken){if(!events.length)status('Connect Google to display your real appointments.');return;}if(loading)return;loading=true;try{const {start,end}=range();const all=calendarList.filter(c=>selectedIds.has(c.id));if(!all.length){events=[];status('No calendars selected. Tap Calendars to choose them.');render();return;}status('Updating appointments…');const batches=await Promise.all(all.map(async cal=>{let pageToken='',items=[];do{const url=new URL('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal.id)+'/events');url.searchParams.set('timeMin',start.toISOString());url.searchParams.set('timeMax',end.toISOString());url.searchParams.set('singleEvents','true');url.searchParams.set('orderBy','startTime');url.searchParams.set('maxResults','250');if(pageToken)url.searchParams.set('pageToken',pageToken);const data=await api(url);items.push(...(data.items||[]).filter(e=>e.start&&e.end&&e.status!=='cancelled').map(e=>({...e,_calendarName:cal.summary,_color:cal.backgroundColor})));pageToken=data.nextPageToken||'';}while(pageToken);return items;}));events=batches.flat();render();status('Showing '+events.length+' events across '+all.length+' calendar(s). Updated '+new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})+'.');}catch(err){status(err.message);}finally{loading=false;}}
// API access tokens are kept in memory only. After expiration, user interaction is required to reconnect.
setInterval(()=>{if(accessToken)refreshEvents();},5*60*1000);render();
</script></body></html>
