<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fire Tablet Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f4;color:#20252c}.dashboard{display:grid;grid-template-columns:1fr 1fr;min-height:100dvh}.photo{position:relative;min-height:100dvh;background:#20252c;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{height:100dvh;width:100%;object-fit:contain}.photo .note{position:absolute;bottom:16px;left:16px;background:#0009;color:white;padding:8px 12px;border-radius:8px;font-size:12px}.calendar{padding:18px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}.top h1{font-size:22px;margin:0}.clock{font-size:17px;font-weight:bold}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{background:white;border:1px solid #e5e7eb;border-radius:8px;min-height:200px;padding:7px 4px}.day h2{font-size:11px;margin:0 0 10px;text-align:center}.day strong{display:block;font-size:17px}.event{font-size:10px;background:#e0efff;border-left:3px solid #3980d5;border-radius:4px;padding:5px 3px;margin-bottom:6px;overflow-wrap:anywhere}.event small{display:block;font-size:9px;margin-bottom:3px}.footer{font-size:12px;color:#626b76;margin-top:16px}@media(max-width:680px){.dashboard{grid-template-columns:1fr}.photo{min-height:50vh}.photo img{height:50vh}.calendar{padding:12px}.day{min-height:140px}.top h1{font-size:18px}}@media(orientation:landscape) and (max-height:500px){.calendar{padding:10px}.day{min-height:155px}.top{margin-bottom:8px}.top h1{font-size:18px}}</style></head><body><main class="dashboard"><section class="photo"><img id="slide" alt="Slideshow sample" src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=800&auto=format&fit=crop"><div class="note">Sample photographs • changes every 15 seconds</div></section><section class="calendar"><div class="top"><h1 id="heading">This week</h1><div class="clock" id="clock"></div></div><div class="week" id="week"></div><div class="footer">Demo calendar events only — Google Calendar is not connected yet.</div></section></main><script>const photos=['photo-1472396961693-142e6e269027','photo-1500534623283-312aade485b7','photo-1441974231531-c6227db76b6e'];let index=0;setInterval(()=>{index=(index+1)%photos.length;document.getElementById('slide').src='https://images.unsplash.com/'+photos[index]+'?w=800&auto=format&fit=crop'},15000);function render(){const now=new Date();document.getElementById('clock').textContent=now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});const monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));const end=new Date(monday);end.setDate(monday.getDate()+6);document.getElementById('heading').textContent=monday.toLocaleDateString([],{month:'short',day:'numeric'})+' – '+end.toLocaleDateString([],{month:'short',day:'numeric'});const samples={1:[['10:00 AM','Appointment']],3:[['2:00 PM','Meeting']],5:[['6:00 PM','Family dinner']]};document.getElementById('week').innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return '<div class="day"><h2>'+d.toLocaleDateString([],{weekday:'short'})+'<strong>'+d.getDate()+'</strong></h2>'+((samples[i]||[]).map(([t,n])=>'<div class="event"><small>'+t+'</small>'+n+'</div>').join(''))+'</div>'}).join('')}render();setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})},10000)</script></body></html>
